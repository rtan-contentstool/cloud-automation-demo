name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:latest .

      - name: Push Docker Image SHA Tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:${{ github.sha }}

      - name: Push Docker Image Latest Tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:latest

      # 6. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/cloud-automation-demo

            docker compose pull

            docker compose up -d

            docker compose ps
