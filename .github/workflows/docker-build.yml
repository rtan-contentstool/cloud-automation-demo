name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Source Checkout
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker Image Build
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:latest \
            .

      # 4. Docker Image Push - Commit SHA
      - name: Push Docker Image SHA Tag
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:${{ github.sha }}

      # 5. Docker Image Push - latest
      - name: Push Docker Image Latest Tag
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-automation-app:latest
