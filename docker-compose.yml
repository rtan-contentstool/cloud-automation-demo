services:

  app:
    image: contentstool/cloud-automation-app:latest
    container_name: cloud-automation-app

    ports:
      - "3000:3000"

    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n2

    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false

    volumes:
      - n8n_data:/home/node/.n8n

    restart: unless-stopped


volumes:
  n8n_data:
